<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Codex Store</title>
    <link rel="shortcut icon" type="image/png" href="https://cdn.rmz.gg/store/favicon/52a6c10cdaede3ef21209a0e04d71cba7af76a73.png" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --rmz-bg: #0a0a0f;
            --rmz-surface: rgba(255, 255, 255, 0.04);
            --rmz-border: rgba(255, 255, 255, 0.08);
            --rmz-text: #e4e4e7;
            --rmz-text-muted: #71717a;
            --rmz-primary: #0066ff;
            --rmz-font: 'Baloo Bhaijaan 2', sans-serif;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background-color: var(--rmz-bg); color: var(--rmz-text); font-family: var(--rmz-font); min-height: 100vh; overflow-x: hidden; }
        #canvas-particles-bg { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: -9999; pointer-events: none; background: linear-gradient(180deg, #020916 0%, #082247 50%, #0d3b7a 100%); }

        header { position: sticky; top: 0; z-index: 30; border-bottom: 1px solid var(--rmz-border); background: rgba(10, 10, 15, 0.85); backdrop-filter: blur(20px); }
        .header-inner { max-width: 1280px; margin: 0 auto; padding: 0 1.5rem; display: flex; align-items: center; justify-content: space-between; height: 64px; }
        .header-right { display: flex; align-items: center; gap: 1rem; }
        .header-right img { height: 36px; width: auto; max-width: 140px; }
        nav.main-nav { display: flex; align-items: center; gap: 0.25rem; }
        nav.main-nav a { padding: 0.5rem 0.75rem; border-radius: 0.5rem; font-size: 0.9rem; color: var(--rmz-text-muted); text-decoration: none; cursor: pointer; transition: 0.2s; }
        nav.main-nav a:hover { color: #fff; background: rgba(255,255,255,0.05); }
        .header-left { display: flex; align-items: center; gap: 0.5rem; }
        .icon-btn { background: transparent; border: none; padding: 6px; border-radius: 0.5rem; color: var(--rmz-text-muted); display: inline-flex; cursor: pointer; position: relative; }
        .icon-btn:hover { color: #fff; background: rgba(255,255,255,0.05); }
        .icon-btn svg { stroke: #00d2ff; fill: none; }
        .icon-btn.discord svg { fill: #00d2ff; stroke: none; }
        .cart-badge { position: absolute; top: -2px; left: -2px; min-width: 18px; height: 18px; display: flex; align-items: center; justify-content: center; border-radius: 50%; background: #00d2ff; color: #020914; font-size: 10px; font-weight: bold; }

        main { max-width: 1280px; margin: 0 auto; padding: 3rem 1.5rem; }
        .section-title { text-align: center; font-size: 1.75rem; font-weight: 700; color: #fff; margin-bottom: 2rem; }
        .products-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 1.5rem; }
        .product-card { background: var(--rmz-surface); backdrop-filter: blur(20px); border: 1px solid var(--rmz-border); border-radius: 1rem; overflow: hidden; display: flex; flex-direction: column; transition: 0.2s; }
        .product-card:hover { transform: translateY(-4px); border-color: rgba(0, 210, 255, 0.3); }
        .product-image { aspect-ratio: 1; background: rgba(255,255,255,0.02); display: flex; align-items: center; justify-content: center; }
        .product-image img { width: 100%; height: 100%; object-fit: cover; }
        .product-image .placeholder-icon { font-size: 3rem; color: var(--rmz-text-muted); opacity: 0.4; }
        .product-info { padding: 1rem; flex: 1; display: flex; flex-direction: column; }
        .product-info h3 { font-size: 1rem; font-weight: 600; color: #fff; margin-bottom: 0.25rem; }
        .product-info .product-category { font-size: 0.75rem; color: var(--rmz-text-muted); margin-bottom: 0.75rem; }
        .product-footer { display: flex; align-items: center; justify-content: space-between; margin-top: auto; }
        .product-price { font-size: 1.1rem; font-weight: 700; color: #00d2ff; }
        .add-to-cart-btn { background: var(--rmz-primary); color: #fff; border: none; width: 40px; height: 40px; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; }
        .add-to-cart-btn:hover { background: #0052cc; }

        .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.7); backdrop-filter: blur(8px); z-index: 1000; display: none; align-items: center; justify-content: center; padding: 1rem; }
        .modal-overlay.active { display: flex; }
        .cart-modal { background: #111118; border: 1px solid var(--rmz-border); border-radius: 1.25rem; max-width: 500px; width: 100%; max-height: 85vh; display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 25px 60px rgba(0,0,0,0.6); }
        .cart-modal.admin-modal { max-width: 800px; }
        .cart-modal-header { display: flex; align-items: center; justify-content: space-between; padding: 1.25rem 1.5rem; border-bottom: 1px solid var(--rmz-border); }
        .cart-modal-header h2 { font-size: 1.2rem; font-weight: 700; color: #fff; }
        .close-btn { background: rgba(255,255,255,0.05); border: none; color: var(--rmz-text-muted); width: 36px; height: 36px; border-radius: 0.75rem; cursor: pointer; }
        .cart-items { flex: 1; overflow-y: auto; padding: 1rem 1.5rem; }
        .cart-item { display: flex; align-items: center; gap: 0.75rem; padding: 0.75rem; border-radius: 0.75rem; border: 1px solid var(--rmz-border); margin-bottom: 0.75rem; background: rgba(255,255,255,0.02); }
        .cart-item-info { flex: 1; min-width: 0; }
        .cart-item-info h4 { font-size: 0.9rem; color: #fff; margin-bottom: 0.25rem; }
        .cart-item-info .item-price { color: #00d2ff; font-weight: 600; font-size: 0.85rem; }
        .cart-item-qty button { background: rgba(255,255,255,0.05); border: none; color: var(--rmz-text); width: 28px; height: 28px; border-radius: 50%; cursor: pointer; }
        .cart-item-qty span { margin: 0 10px; font-weight: 600; }
        .cart-item-remove { background: rgba(239, 68, 68, 0.1); border: none; color: #ef4444; width: 32px; height: 32px; border-radius: 0.5rem; cursor: pointer; }
        .cart-modal-footer { padding: 1.25rem 1.5rem; border-top: 1px solid var(--rmz-border); }
        .cart-total { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; }
        .cart-total span:last-child { color: #00d2ff; font-size: 1.4rem; font-weight: 700; }
        .checkout-btn { width: 100%; height: 48px; background: var(--rmz-primary); color: #fff; border: none; border-radius: 0.75rem; font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: center; }
        .checkout-btn:hover { background: #0052cc; }

        .admin-tabs { display: flex; gap: 0.5rem; margin-bottom: 1.5rem; border-bottom: 1px solid var(--rmz-border); padding-bottom: 1rem; }
        .admin-tab { padding: 0.5rem 1rem; cursor: pointer; color: var(--rmz-text-muted); border-radius: 0.5rem; background: transparent; border: none; }
        .admin-tab.active { background: var(--rmz-primary); color: #fff; }
        .admin-section { display: none; }
        .admin-section.active { display: block; }
        
        .form-group { margin-bottom: 1rem; }
        .form-group label { display: block; margin-bottom: 0.5rem; color: var(--rmz-text-muted); font-size: 0.85rem; }
        .form-control { width: 100%; padding: 0.75rem; background: rgba(255,255,255,0.05); border: 1px solid var(--rmz-border); color: #fff; border-radius: 0.5rem; font-family: inherit; outline: none; }
        .admin-table { width: 100%; border-collapse: collapse; text-align: right; margin-top: 1rem; }
        .admin-table th, .admin-table td { padding: 0.75rem; border-bottom: 1px solid var(--rmz-border); color: #fff; font-size: 0.9rem; }
        #admin-trigger { cursor: pointer; color: #333; font-size: 12px; }
        #admin-trigger:hover { color: #00d2ff; }
        .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: #10b981; color: #fff; padding: 10px 20px; border-radius: 8px; display: none; z-index: 9999; }
    </style>
</head>
<body>
    <canvas id="canvas-particles-bg"></canvas>

    <header>
        <div class="header-inner">
            <div class="header-right">
                <a href="#" style="display:flex; align-items:center; gap:0.75rem; text-decoration:none;">
                    <img src="https://cdn.rmz.gg/store/logo/73f7cab9240568bed62af22acec55876fc0585b3.png" alt="Codex Store">
                </a>
            </div>
            <nav class="main-nav">
                <a onclick="window.scrollTo(0,0)">الرئيسية</a>
                <a onclick="document.getElementById('products-grid').scrollIntoView({behavior: 'smooth'})">المنتجات</a>
                <a id="admin-trigger" onclick="openAdminLogin()">⚙️ لوحة التحكم</a>
            </nav>
            <div class="header-left">
                <a href="https://discord.gg/MW4" target="_blank" class="icon-btn discord">
                    <svg width="22" height="22" viewBox="0 0 127.14 96.36"><path d="M107.7 8.07A105.15 105.15 0 0 0 81.47 0a72.06 72.06 0 0 0-3.36 6.83 97.68 97.68 0 0 0-29.11 0A72.37 72.37 0 0 0 45.64 0a105.89 105.89 0 0 0-26.25 8.09C2.79 32.65-1.71 56.6.54 80.21a105.73 105.73 0 0 0 32.17 16.15 77.7 77.7 0 0 0 6.89-11.11 68.42 68.42 0 0 1-10.85-5.18c.91-.66 1.8-1.34 2.66-2a75.57 75.57 0 0 0 64.32 0c.87.68 1.76 1.36 2.66 2a68.68 68.68 0 0 1-10.87 5.19 77 77 0 0 0 6.89 11.1 105.25 105.25 0 0 0 32.19-16.14c2.64-27.38-4.51-51.11-18.91-72.14zM42.45 65.69c-6.32 0-11.52-5.8-11.52-12.91s5.08-12.91 11.52-12.91 5.08-12.91 11.52-12.91c6.49 0 11.64 5.84 11.52 12.91 0 7.11-5.08 12.91-11.52 12.91zm42.24 0c-6.32 0-11.52-5.8-11.52-12.91s5.08-12.91 11.52-12.91c6.49 0 11.64 5.84 11.52 12.91 0 7.11-5.08 12.91-11.52 12.91z"/></svg>
                </a>
                <button class="icon-btn" onclick="openCart()">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke-width="2"><path d="M16 11V7a4 4 0 0 0-8 0v4M5 9h14l1 12H4L5 9z"/></svg>
                    <span class="cart-badge" id="cart-count">0</span>
                </button>
            </div>
        </div>
    </header>

    <main>
        <h2 class="section-title" id="products-grid">أحدث المنتجات</h2>
        <div class="products-grid" id="store-products"></div>
    </main>

    <!-- نافذة السلة -->
    <div class="modal-overlay" id="cart-modal">
        <div class="cart-modal">
            <div class="cart-modal-header">
                <h2>سلة التسوق</h2>
                <button class="close-btn" onclick="closeModal('cart-modal')">&times;</button>
            </div>
            <div class="cart-items" id="cart-items-container"></div>
            <div class="cart-modal-footer">
                <div class="cart-total">
                    <span>المجموع:</span>
                    <span id="cart-total-price">0 ر.س</span>
                </div>
                <button class="checkout-btn" onclick="checkout()">إتمام الطلب (واتساب)</button>
            </div>
        </div>
    </div>

    <!-- نافذة تسجيل دخول المدير -->
    <div class="modal-overlay" id="admin-login-modal">
        <div class="cart-modal" style="max-width: 400px;">
            <div class="cart-modal-header">
                <h2>دخول المدير</h2>
                <button class="close-btn" onclick="closeModal('admin-login-modal')">&times;</button>
            </div>
            <div style="padding: 1.5rem;">
                <div class="form-group">
                    <label>اسم المستخدم</label>
                    <input type="text" id="admin-user" class="form-control">
                </div>
                <div class="form-group">
                    <label>كلمة المرور</label>
                    <input type="password" id="admin-pass" class="form-control">
                </div>
                <button class="checkout-btn" onclick="loginAdmin()">دخول</button>
            </div>
        </div>
    </div>

    <!-- لوحة التحكم -->
    <div class="modal-overlay" id="admin-modal">
        <div class="cart-modal admin-modal">
            <div class="cart-modal-header">
                <h2>لوحة التحكم</h2>
                <button class="close-btn" onclick="closeModal('admin-modal')">&times;</button>
            </div>
            <div style="padding: 1.5rem; overflow-y: auto;">
                <div class="admin-tabs">
                    <button class="admin-tab active" onclick="switchAdminTab('products')">المنتجات</button>
                    <button class="admin-tab" onclick="switchAdminTab('orders')">الطلبات</button>
                    <button class="admin-tab" onclick="switchAdminTab('settings')">الإعدادات</button>
                </div>

                <div id="admin-tab-products" class="admin-section active">
                    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:1rem;">
                        <h3 style="color:#fff;">إدارة المنتجات</h3>
                        <button class="checkout-btn" style="width:auto; padding:0.5rem 1rem;" onclick="showProductForm()">+ منتج جديد</button>
                    </div>
                    <div id="product-form" style="display:none; background: rgba(255,255,255,0.02); padding: 1rem; border-radius: 0.5rem; border: 1px solid var(--rmz-border); margin-bottom: 1rem;">
                        <div class="form-group"><label>اسم المنتج</label><input type="text" id="p-name" class="form-control"></div>
                        <div class="form-group"><label>السعر (ر.س)</label><input type="number" id="p-price" class="form-control"></div>
                        <div class="form-group"><label>رابط الصورة (URL)</label><input type="text" id="p-image" class="form-control"></div>
                        <div class="form-group"><label>الوصف</label><input type="text" id="p-desc" class="form-control"></div>
                        <button class="checkout-btn" style="width:auto; padding:0.5rem 1rem;" onclick="saveProduct()">حفظ</button>
                        <button class="close-btn" onclick="hideProductForm()">إلغاء</button>
                    </div>
                    <table class="admin-table" id="admin-products-table">
                        <thead><tr><th>المنتج</th><th>السعر</th><th>حذف</th></tr></thead>
                        <tbody></tbody>
                    </table>
                </div>

                <div id="admin-tab-orders" class="admin-section">
                    <h3 style="color:#fff; margin-bottom:1rem;">سجل الطلبات</h3>
                    <table class="admin-table" id="admin-orders-table">
                        <thead><tr><th>العميل</th><th>الطلب</th><th>الإجمالي</th></tr></thead>
                        <tbody></tbody>
                    </table>
                </div>

                <div id="admin-tab-settings" class="admin-section">
                    <h3 style="color:#fff; margin-bottom:1rem;">إعدادات المتجر</h3>
                    <div class="form-group">
                        <label>رقم الواتساب</label>
                        <input type="text" id="s-whatsapp" class="form-control" placeholder="966500000000">
                    </div>
                    <button class="checkout-btn" style="width:auto; padding:0.5rem 1rem;" onclick="saveSettings()">حفظ الإعدادات</button>
                </div>
            </div>
        </div>
    </div>

    <div class="toast" id="toast">تم بنجاح</div>

    <script>
        // ==================== البيانات الافتراضية ====================
        let products = JSON.parse(localStorage.getItem('codex_products')) || [
            { id: '1', name: "Fortnite - 1000 V-Bucks", price: 40, image: "", desc: "شحن فوري" },
            { id: '2', name: "MW3 - حساب كامل", price: 250, image: "", desc: "حساب مع ضمان" }
        ];
        let orders = JSON.parse(localStorage.getItem('codex_orders')) || [];
        let cart = JSON.parse(localStorage.getItem('codex_cart')) || [];
        let settings = JSON.parse(localStorage.getItem('codex_settings')) || { whatsapp: "966500000000" };

        function saveData() {
            localStorage.setItem('codex_products', JSON.stringify(products));
            localStorage.setItem('codex_orders', JSON.stringify(orders));
            localStorage.setItem('codex_cart', JSON.stringify(cart));
            localStorage.setItem('codex_settings', JSON.stringify(settings));
            renderStore();
            renderAdminTables();
            updateCartCount();
        }

        function showToast(msg) { const t = document.getElementById('toast'); t.textContent = msg; t.style.display = 'block'; setTimeout(() => t.style.display = 'none', 2000); }
        function closeModal(id) { document.getElementById(id).classList.remove('active'); }

        // ==================== المتجر ====================
        function renderStore() {
            const container = document.getElementById('store-products');
            if (products.length === 0) {
                container.innerHTML = '<p style="color:#fff; text-align:center; grid-column:1/-1;">لا توجد منتجات حالياً.</p>';
                return;
            }
            container.innerHTML = products.map(p => `
                <div class="product-card">
                    ${p.image ? `<div class="product-image"><img src="${p.image}"></div>` : `<div class="product-image"><i class="fas fa-box placeholder-icon"></i></div>`}
                    <div class="product-info">
                        <h3>${p.name}</h3>
                        <div class="product-category">${p.desc || 'متوفر الآن'}</div>
                        <div class="product-footer">
                            <span class="product-price">${p.price} ر.س</span>
                            <button class="add-to-cart-btn" onclick="addToCart('${p.id}')"><i class="fas fa-plus"></i></button>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function addToCart(id) {
            const product = products.find(p => p.id === id);
            const existing = cart.find(c => c.id === id);
            if (existing) existing.qty++;
            else cart.push({ ...product, qty: 1 });
            saveData(); showToast('تمت الإضافة للسلة');
        }

        function openCart() { renderCart(); document.getElementById('cart-modal').classList.add('active'); }

        function renderCart() {
            const container = document.getElementById('cart-items-container');
            if (cart.length === 0) {
                container.innerHTML = '<p style="color:#fff; text-align:center;">السلة فارغة</p>';
                document.getElementById('cart-total-price').textContent = '0 ر.س';
                return;
            }
            container.innerHTML = cart.map((c, index) => `
                <div class="cart-item">
                    ${c.image ? `<img src="${c.image}" style="width:50px; height:50px; border-radius:0.5rem;">` : `<div style="width:50px; height:50px; background:#222; border-radius:0.5rem;"></div>`}
                    <div class="cart-item-info">
                        <h4>${c.name}</h4>
                        <div class="item-price">${c.price} ر.س</div>
                    </div>
                    <div class="cart-item-qty">
                        <button onclick="changeQty(${index}, 1)">+</button>
                        <span>${c.qty}</span>
                        <button onclick="changeQty(${index}, -1)">-</button>
                    </div>
                </div>
            `).join('');
            let total = cart.reduce((sum, c) => sum + (c.price * c.qty), 0);
            document.getElementById('cart-total-price').textContent = total.toFixed(2) + ' ر.س';
        }

        function changeQty(index, delta) { cart[index].qty += delta; if (cart[index].qty <= 0) cart.splice(index, 1); saveData(); renderCart(); }
        function updateCartCount() { document.getElementById('cart-count').textContent = cart.reduce((sum, c) => sum + c.qty, 0); }

        // ==================== إتمام الطلب ====================
        function checkout() {
            if (cart.length === 0) return alert('السلة فارغة!');
            let total = cart.reduce((sum, c) => sum + (c.price * c.qty), 0);
            const orderId = 'ORD-' + Date.now().toString().slice(-6);
            orders.push({ id: orderId, customer: "عميل", items: cart.map(c => `${c.name} (x${c.qty})`).join(', '), total: total.toFixed(2) });
            saveData();
            let waText = `مرحباً، أريد طلب:\n${cart.map(c => `- ${c.name} (x${c.qty})`).join('\n')}\n\nالإجمالي: ${total} ر.س`;
            window.open(`https://wa.me/${settings.whatsapp}?text=${encodeURIComponent(waText)}`, '_blank');
            cart = []; saveData(); closeModal('cart-modal'); showToast('تم إرسال الطلب!');
        }

        // ==================== لوحة التحكم ====================
        const ADMIN_USER = "laowfhd4gfd3vd";
        const ADMIN_PASS = "hjdfjgjteshgjyrs65jgf";
        function openAdminLogin() { document.getElementById('admin-login-modal').classList.add('active'); }
        function loginAdmin() {
            if (document.getElementById('admin-user').value === ADMIN_USER && document.getElementById('admin-pass').value === ADMIN_PASS) {
                closeModal('admin-login-modal'); document.getElementById('admin-modal').classList.add('active'); renderAdminTables();
            } else alert('بيانات الدخول خاطئة!');
        }
        function switchAdminTab(tabName) {
            document.querySelectorAll('.admin-tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.admin-section').forEach(s => s.classList.remove('active'));
            event.target.classList.add('active'); document.getElementById('admin-tab-' + tabName).classList.add('active');
        }
        function showProductForm() { document.getElementById('product-form').style.display = 'block'; }
        function hideProductForm() { document.getElementById('product-form').style.display = 'none'; }
        function saveProduct() {
            const name = document.getElementById('p-name').value, price = parseFloat(document.getElementById('p-price').value);
            if (!name || !price) return alert('أدخل اسم وسعر المنتج');
            products.push({ id: Date.now().toString(), name, price, image: document.getElementById('p-image').value, desc: document.getElementById('p-desc').value });
            saveData(); hideProductForm();
            document.getElementById('p-name').value = ''; document.getElementById('p-price').value = ''; document.getElementById('p-image').value = ''; document.getElementById('p-desc').value = '';
            showToast('تم إضافة المنتج');
        }
        function deleteProduct(id) { if (confirm('تأكيد الحذف؟')) { products = products.filter(p => p.id !== id); saveData(); } }
        function saveSettings() { settings.whatsapp = document.getElementById('s-whatsapp').value; saveData(); showToast('تم حفظ الإعدادات'); }
        function renderAdminTables() {
            document.querySelector('#admin-products-table tbody').innerHTML = products.map(p => `<tr><td>${p.name}</td><td>${p.price} ر.س</td><td><button class="cart-item-remove" onclick="deleteProduct('${p.id}')"><i class="fas fa-trash"></i></button></td></tr>`).join('');
            document.querySelector('#admin-orders-table tbody').innerHTML = orders.map(o => `<tr><td>${o.customer}</td><td>${o.items}</td><td>${o.total} ر.س</td></tr>`).join('');
            document.getElementById('s-whatsapp').value = settings.whatsapp;
        }

        // ==================== 5. خلفية النجوم والتفاعل ====================
        renderStore();
        updateCartCount();

        const canvas = document.getElementById('canvas-particles-bg');
        const ctx = canvas.getContext('2d');
        let width, height, particles = [];
        const mouse = { x: null, y: null, radius: 180 };

        window.addEventListener('mousemove', e => { mouse.x = e.clientX; mouse.y = e.clientY; });

        function resizeCanvas() { width = canvas.width = window.innerWidth; height = canvas.height = window.innerHeight; }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        class Particle {
            constructor() {
                this.x = Math.random() * width;
                this.y = Math.random() * height;
                this.vx = (Math.random() - 0.5) * 0.6;
                this.vy = (Math.random() - 0.5) * 0.6;
                this.radius = Math.random() * 1.5 + 1;
            }
            update() {
                this.x += this.vx; this.y += this.vy;
                if (this.x < 0 || this.x > width) this.vx *= -1;
                if (this.y < 0 || this.y > height) this.vy *= -1;
                if (mouse.x !== null && mouse.y !== null) {
                    const dx = mouse.x - this.x; const dy = mouse.y - this.y;
                    const dist = Math.sqrt(dx*dx + dy*dy);
                    if (dist < mouse.radius) {
                        const force = (mouse.radius - dist) / mouse.radius;
                        this.x -= (dx / dist) * force * 3;
                        this.y -= (dy / dist) * force * 3;
                    }
                }
            }
            draw() {
                ctx.beginPath(); ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = '#00d2ff'; ctx.shadowColor = '#00d2ff'; ctx.shadowBlur = 6; ctx.fill();
            }
        }

        for (let i = 0; i < Math.min(Math.floor((window.innerWidth * window.innerHeight) / 10000), 80); i++) particles.push(new Particle());

        function animate() {
            ctx.clearRect(0, 0, width, height);
            for (let i = 0; i < particles.length; i++) {
                particles[i].update(); particles[i].draw();
                for (let j = i + 1; j < particles.length; j++) {
                    const dx = particles[i].x - particles[j].x; const dy = particles[i].y - particles[j].y;
                    const dist = Math.sqrt(dx*dx + dy*dy);
                    if (dist < 120) {
                        ctx.beginPath(); ctx.moveTo(particles[i].x, particles[i].y); ctx.lineTo(particles[j].x, particles[j].y);
                        ctx.strokeStyle = `rgba(0, 210, 255, ${(1 - dist / 120) * 0.3})`; ctx.lineWidth = 0.6; ctx.stroke();
                    }
                }
            }
            requestAnimationFrame(animate);
        }
        animate();
    </script>
</body>
